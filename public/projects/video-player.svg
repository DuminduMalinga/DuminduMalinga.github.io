<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Video Player app illustration">
  <defs>
    <linearGradient id="vp-bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="vp-stage" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <pattern id="vp-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#vp-bg)"/>
  <rect width="640" height="360" fill="url(#vp-dots)"/>
  <circle cx="170" cy="90" r="130" fill="#00b8d9" opacity="0.10"/>
  <circle cx="520" cy="300" r="120" fill="#38bdf8" opacity="0.10"/>

  <!-- app window -->
  <g transform="translate(70 54)">
    <rect x="-8" y="-8" width="516" height="268" rx="18" fill="#020617" opacity="0.5"/>
    <rect x="0" y="0" width="500" height="252" rx="14" fill="#141d33" stroke="#2c3a58" stroke-width="2"/>

    <!-- title bar -->
    <rect x="0" y="0" width="500" height="30" rx="14" fill="#1b2740"/>
    <rect x="0" y="16" width="500" height="14" fill="#1b2740"/>
    <circle cx="18" cy="15" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="15" r="4.5" fill="#febc2e"/>
    <circle cx="50" cy="15" r="4.5" fill="#28c840"/>
    <text x="250" y="19" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#8ea3c7">Video Player</text>

    <!-- video stage -->
    <rect x="16" y="44" width="330" height="150" rx="8" fill="url(#vp-stage)" stroke="#243252" stroke-width="1.5"/>
    <circle cx="181" cy="119" r="30" fill="#00b8d9"/>
    <path d="M172 104l24 15-24 15z" fill="#0a1120"/>

    <!-- scrubber -->
    <rect x="16" y="206" width="330" height="4" rx="2" fill="#2b3a5a"/>
    <rect x="16" y="206" width="132" height="4" rx="2" fill="#00b8d9"/>
    <circle cx="148" cy="208" r="6" fill="#e2e8f0"/>
    <g fill="#8ea3c7">
      <path d="M20 226h10M20 226l4-3v6zM30 223v6" stroke="#8ea3c7" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="300" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#8ea3c7">01:24 / 04:12</text>
    <!-- transport controls -->
    <g transform="translate(150 222)" fill="#cbd5f5">
      <path d="M0 0l-8 5 8 5zM10 0l-8 5 8 5z"/>
      <rect x="24" y="-1" width="4" height="12" rx="1"/>
      <rect x="32" y="-1" width="4" height="12" rx="1"/>
      <path d="M48 0l8 5-8 5zM58 0l8 5-8 5z"/>
    </g>

    <!-- playlist -->
    <text x="366" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">Playlist</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#aab8d4">
      <rect x="362" y="60" width="122" height="26" rx="6" fill="#00b8d9" opacity="0.18"/>
      <rect x="370" y="68" width="18" height="12" rx="2" fill="#00b8d9"/>
      <text x="394" y="77" fill="#e2e8f0">Clip 01</text>

      <rect x="370" y="94" width="18" height="12" rx="2" fill="#33415f"/>
      <text x="394" y="103">Clip 02</text>
      <rect x="370" y="118" width="18" height="12" rx="2" fill="#33415f"/>
      <text x="394" y="127">Clip 03</text>
      <rect x="370" y="142" width="18" height="12" rx="2" fill="#33415f"/>
      <text x="394" y="151">Clip 04</text>
      <rect x="370" y="166" width="18" height="12" rx="2" fill="#33415f"/>
      <text x="394" y="175">Clip 05</text>
    </g>
  </g>

  <!-- tag chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">
    <rect x="70" y="316" width="70" height="24" rx="12" fill="#00b8d9"/>
    <text x="105" y="332" text-anchor="middle" fill="#0b1027">Flutter</text>
    <rect x="148" y="316" width="60" height="24" rx="12" fill="#e2e8f0"/>
    <text x="178" y="332" text-anchor="middle" fill="#0b1027">Dart</text>
    <rect x="216" y="316" width="54" height="24" rx="12" fill="#334155"/>
    <text x="243" y="332" text-anchor="middle" fill="#e2e8f0">OOP</text>
  </g>
</svg>
