<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Personal Reflection App illustration">
  <defs>
    <linearGradient id="pr-bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="pr-screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b1027"/>
      <stop offset="1" stop-color="#141a3a"/>
    </linearGradient>
    <pattern id="pr-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#pr-bg)"/>
  <rect width="640" height="360" fill="url(#pr-dots)"/>

  <!-- ambient glow -->
  <circle cx="470" cy="80" r="130" fill="#00b8d9" opacity="0.10"/>
  <circle cx="120" cy="320" r="120" fill="#8b5cf6" opacity="0.12"/>

  <!-- phone -->
  <g transform="translate(232 44)">
    <rect x="-6" y="-6" width="188" height="284" rx="30" fill="#020617" opacity="0.55"/>
    <rect x="0" y="0" width="176" height="272" rx="26" fill="#1c2350" stroke="#3b3f7a" stroke-width="2"/>
    <rect x="10" y="10" width="156" height="252" rx="18" fill="url(#pr-screen)"/>
    <rect x="62" y="16" width="52" height="8" rx="4" fill="#2b2f66"/>

    <!-- header -->
    <text x="26" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Today</text>
    <text x="26" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#94a3d4">Daily reflection</text>

    <!-- progress ring -->
    <g transform="translate(118 58)">
      <circle r="20" fill="none" stroke="#2b3170" stroke-width="6"/>
      <circle r="20" fill="none" stroke="#00b8d9" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="94 126" transform="rotate(-90)"/>
      <text x="0" y="4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">75%</text>
    </g>

    <!-- goal checklist -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#cbd5f5">
      <rect x="20" y="92" width="136" height="30" rx="8" fill="#ffffff" opacity="0.04"/>
      <circle cx="34" cy="107" r="6" fill="#00b8d9"/>
      <path d="M31 107l2.4 2.4 4-4.6" stroke="#0b1027" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="110">Morning journaling</text>

      <rect x="20" y="128" width="136" height="30" rx="8" fill="#ffffff" opacity="0.04"/>
      <circle cx="34" cy="143" r="6" fill="#00b8d9"/>
      <path d="M31 143l2.4 2.4 4-4.6" stroke="#0b1027" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="146">Read 20 minutes</text>

      <rect x="20" y="164" width="136" height="30" rx="8" fill="#ffffff" opacity="0.04"/>
      <circle cx="34" cy="179" r="6" fill="none" stroke="#5b60a8" stroke-width="1.6"/>
      <text x="48" y="182">Evening review</text>
    </g>

    <!-- week streak -->
    <g transform="translate(20 206)">
      <text font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#94a3d4">This week</text>
      <g transform="translate(0 8)">
        <rect x="0" y="0" width="14" height="14" rx="3" fill="#00b8d9" opacity="0.9"/>
        <rect x="20" y="0" width="14" height="14" rx="3" fill="#00b8d9" opacity="0.9"/>
        <rect x="40" y="0" width="14" height="14" rx="3" fill="#00b8d9" opacity="0.5"/>
        <rect x="60" y="0" width="14" height="14" rx="3" fill="#00b8d9" opacity="0.9"/>
        <rect x="80" y="0" width="14" height="14" rx="3" fill="#2b3170"/>
        <rect x="100" y="0" width="14" height="14" rx="3" fill="#2b3170"/>
        <rect x="120" y="0" width="14" height="14" rx="3" fill="#2b3170"/>
      </g>
    </g>
  </g>

  <!-- firebase sync badge -->
  <g transform="translate(410 264)">
    <rect x="0" y="0" width="150" height="40" rx="12" fill="#0b1027" stroke="#00b8d9" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M20 30l6-22 8 12 6-10 8 20z" fill="#ffca28"/>
    <path d="M20 30l28 0 -8-20z" fill="#ffa000" opacity="0.9"/>
    <text x="56" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">Firebase sync</text>
    <text x="56" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#94a3d4">Multi-device</text>
  </g>

  <!-- tag chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#0b1027">
    <rect x="40" y="60" width="70" height="24" rx="12" fill="#00b8d9"/>
    <text x="75" y="76" text-anchor="middle">Android</text>
    <rect x="40" y="94" width="54" height="24" rx="12" fill="#e2e8f0"/>
    <text x="67" y="110" text-anchor="middle">Java</text>
    <rect x="40" y="128" width="82" height="24" rx="12" fill="#8b5cf6"/>
    <text x="81" y="144" text-anchor="middle" fill="#f8fafc">Room DB</text>
  </g>
</svg>
